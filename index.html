<style>
/* Claude-style design: warm ivory paper, serif headings, quiet sans UI text, one coral accent.
   Layout: sticky header (brand, date, countdown) over pill tabs; content as soft cards in an auto-fit grid. */
:root {
  --bg: #F5F4EE; --surface: #FFFFFF; --sunk: #EFEDE4; --ink: #1F1E1B; --muted: #6E6B62; --line: #E3E0D5;
  --accent: #C96442; --accent-ink: #FFFFFF; --accent-soft: #F6E4DA;
  --good: #3B7A4A; --good-soft: #E4EFDF; --warn: #9A6212; --warn-soft: #F5EAD3; --bad: #B23A2A; --bad-soft: #F6DFD9;
  --star: #B07A18;
  --heat-0: #ECE9DF; --heat-1: #F2D3C3; --heat-2: #E6A587; --heat-3: #D47A57; --heat-4: #A84F31;
  --f-display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
  --shadow: 0 1px 2px rgba(31, 30, 27, 0.04), 0 2px 10px rgba(31, 30, 27, 0.035);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #262624; --surface: #30302E; --sunk: #3A3936; --ink: #F2F0E8; --muted: #A9A69B; --line: #45443F;
  --accent: #E08A68; --accent-ink: #1F1E1B; --accent-soft: #4A3229;
  --good: #7DBE8C; --good-soft: #2C3A2D; --warn: #E2B15C; --warn-soft: #43371F; --bad: #EE8A78; --bad-soft: #4A2C26;
  --star: #E5B65A; --heat-0: #3A3936; --heat-1: #5A3A2E; --heat-2: #8C4E37; --heat-3: #C26C4A; --heat-4: #F0A283;
  --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #262624; --surface: #30302E; --sunk: #3A3936; --ink: #F2F0E8; --muted: #A9A69B; --line: #45443F;
  --accent: #E08A68; --accent-ink: #1F1E1B; --accent-soft: #4A3229;
  --good: #7DBE8C; --good-soft: #2C3A2D; --warn: #E2B15C; --warn-soft: #43371F; --bad: #EE8A78; --bad-soft: #4A2C26;
  --star: #E5B65A; --heat-0: #3A3936; --heat-1: #5A3A2E; --heat-2: #8C4E37; --heat-3: #C26C4A; --heat-4: #F0A283;
  --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
code, .num, pre { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
code { font-size: 12.5px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; word-break: break-word; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.005em; }
h2 { font-size: 19px; }
h3 { font-size: 16.5px; }
h4 { font-size: 15px; margin-top: 16px; }
p { margin: 6px 0; }
.wrap { max-width: 1140px; margin: 0 auto; padding-inline: 16px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: saturate(1.2) blur(10px); -webkit-backdrop-filter: saturate(1.2) blur(10px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-block: 12px 6px; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; display: inline-flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 20px; height: 20px; border-radius: 6px; background: radial-gradient(circle, var(--bg) 0 3px, var(--accent) 3.6px); flex: none; }
.brand span { color: var(--accent); }
#meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; }
#meta b { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs { padding-block: 4px 10px; gap: 4px; }
.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: 500 14px var(--f-body); padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.tabs button:hover { color: var(--ink); background: var(--sunk); }

#banner { margin-top: 12px; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-weight: 500; }
#view { display: flex; flex-direction: column; gap: 16px; padding-block: 18px 60px; }
#view.form-first #form { order: -1; }
#live { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
#live:empty, #form:empty { display: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.grid > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.card-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.eyebrow { font: 500 11.5px var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { font-size: 30px; font-weight: 500; line-height: 1.15; margin-top: 6px; }

.bar-row { display: grid; grid-template-columns: minmax(84px, 120px) minmax(40px, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; padding-block: 3px; }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--muted); border-radius: 99px; }
.bar.good i { background: var(--good); } .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }
.bar-row b { text-align: right; font-weight: 500; }

.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 11.5px var(--f-body); padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.btn { font: 500 13.5px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s, transform .05s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--bg); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 11px; font-size: 12.5px; border-radius: 8px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions .btn { white-space: normal; text-align: left; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.sched { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; }
.sched .num { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

.prob { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding-block: 10px; border-top: 1px solid var(--line); }
.prob:first-child { border-top: 0; }
.prob .pn { color: var(--muted); font-size: 12.5px; padding-top: 2px; }
.prob.done .pn { color: var(--good); }
.prob a { font-weight: 600; text-decoration: none; color: var(--ink); }
.prob a:hover { color: var(--accent); text-decoration: underline; }
.psub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.pact { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
@media (max-width: 560px) { .prob { grid-template-columns: 30px minmax(0, 1fr); } .pact { grid-column: 2; justify-content: flex-start; } }
.star { color: var(--star); margin-left: 4px; }
.diff { font: 600 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.d-E { background: var(--good-soft); color: var(--good); } .d-M { background: var(--warn-soft); color: var(--warn); } .d-H { background: var(--bad-soft); color: var(--bad); }
.chip { font: 500 12px var(--f-mono); padding: 2px 7px; border-radius: 5px; background: var(--sunk); color: var(--muted); text-decoration: none; }
.chip.done { background: var(--good-soft); color: var(--good); }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
input, select, textarea { font: 14px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { min-height: 64px; resize: vertical; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.fgrid .span { grid-column: 1 / -1; }
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 13.5px; }
.inline label { display: inline-flex; align-items: center; gap: 6px; }
.auto { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; }

.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding-block: 3px; cursor: pointer; }
.check input { margin-top: 3px; }
.week.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 10px; font-size: 13.5px; margin-top: 10px; }
.kv dt { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.kv dd { margin: 0; }

.flag { border-left: 3px solid var(--bad); padding: 6px 0 6px 10px; margin-top: 8px; }
.flag b { display: block; }
.ok { color: var(--good); font-weight: 600; }

details.qa { border-top: 1px solid var(--line); padding-block: 8px; }
details.qa summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.qa summary::-webkit-details-marker { display: none; }
details.qa summary .q { flex: 1; font-weight: 500; }
details.qa .a { margin: 6px 0 0 34px; color: var(--muted); font-size: 13.5px; }
.known .q { color: var(--good); }

.prose { max-width: 72ch; font-size: 14.5px; }
.prose blockquote { margin: 8px 0; padding: 8px 12px; background: var(--sunk); border-radius: 8px; }
.prose ol, .prose ul { padding-left: 20px; margin: 6px 0; }
pre { background: var(--sunk); border-radius: 8px; padding: 12px; overflow-x: auto; font: 12.5px/1.55 var(--f-mono); white-space: pre-wrap; margin: 8px 0 0; }
pre.code { white-space: pre; }
.subnav { display: flex; flex-wrap: wrap; gap: 6px; }

.lesson h1 { font-size: 34px; font-weight: 500; line-height: 1.15; margin: 10px 0 8px; }
.lesson { padding: 28px clamp(20px, 4vw, 44px); }
.lesson p, .lesson li { font-size: 16px; line-height: 1.65; }
.lesson h2 { font-size: 22px; font-weight: 500; }
.lesson h2 { margin-top: 26px; }
.lesson p, .lesson li { max-width: 72ch; }
.lesson ol, .lesson ul { padding-left: 22px; }
.lesson li { margin: 4px 0; }
.lead { font-size: 16.5px; }
.why { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.codewrap { margin-top: 10px; }
.codehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: -2px; }
pre.out { background: var(--surface); border: 1px dashed var(--line); }
.quiz { border-top: 1px solid var(--line); padding-block: 12px; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; max-width: 72ch; }
.opt { text-align: left; font: 14px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.okc { color: var(--good); }
.lrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 12px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 0; cursor: pointer; color: inherit; font: inherit; }
.lrow:first-of-type { border-top: 0; }
.lrow:hover .lt { color: var(--accent); }
.lt { font-weight: 600; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); margin-top: 4px; }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.now { border-color: var(--accent); background: var(--accent-soft); }
ol.steps { padding-left: 20px; margin: 8px 0 0; font-size: 14px; }
ol.steps li { margin: 4px 0; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.hm-wrap { overflow-x: auto; padding-bottom: 4px; }
.hm { display: grid; grid-template-columns: 34px repeat(13, 20px); grid-auto-rows: 20px; gap: 5px; width: max-content; font-size: 11px; }
.hm-m { color: var(--muted); font-size: 11px; white-space: nowrap; align-self: end; }
.hm-d { color: var(--muted); font-size: 10.5px; line-height: 20px; }
.hm-cell { width: 20px; height: 20px; border-radius: 5px; background: var(--heat-0); border: 0; padding: 0; }
.hm-cell.l1 { background: var(--heat-1); } .hm-cell.l2 { background: var(--heat-2); } .hm-cell.l3 { background: var(--heat-3); } .hm-cell.l4 { background: var(--heat-4); }
.hm-cell.future { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.hm-cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.hm-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.hm-legend { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
.hm-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.hm-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; margin-bottom: 10px; }
.hm-stats b { font-family: var(--f-mono); font-size: 15px; }
#hmTip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 7px; max-width: 240px; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-weight: 500; font-size: 13.5px; z-index: 20; max-width: calc(100% - 32px); }
#copyPanel { position: fixed; inset: auto 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px; max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; z-index: 21; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
#copyPanel textarea { min-height: 180px; font: 12.5px var(--f-mono); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s ease; } }
</style>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- static data ----------
  const P = {};
  PROBLEMS.forEach((g) => g.items.forEach(([n, name, diff, pattern, tip, star, ov]) => {
    const slug = ov || name.toLowerCase().replace(/[^a-z0-9 -]/g, "").trim().replace(/\s+/g, "-").replace(/-+/g, "-");
    P[n] = { n, name, diff, pattern, tip, star: star === 1, topic: g.topic, url: slug.startsWith("http") ? slug : "https://leetcode.com/problems/" + slug + "/" };
  }));
  const NUMS = Object.keys(P).map(Number).sort((a, b) => a - b);
  const WEEKS = PLAN.weeks;
  const STATUSES = ["Wishlist", "Applied", "OA", "R1", "R2", "R3", "HR", "Offer", "Accepted", "Rejected", "Ghosted"];
  const CLOSED = ["Rejected", "Ghosted", "Accepted"];
  const SOURCES = ["Referral", "LinkedIn", "Wellfound", "YC Work at a Startup", "Cold DM", "Instahyre/Cutshort/Hirist", "Naukri", "Career page", "Off-campus drive", "Other"];
  const TIERS = ["A", "B", "C", "D", "E"];

  // ---------- state ----------
  const S = { logs: {}, problems: {}, apps: {}, weeks: {}, mocks: {}, meta: {}, db: null, tab: "learn",
    logDate: null, reviewWeek: null, probFilter: "all", csTopic: "oop", editApp: null, appFilter: "active", confirmDel: null, pending: false,
    lesson: null, quiz: {}, heatMetric: "all" };
  try { const t = localStorage.getItem("lpa.tab"); if (t) S.tab = t; } catch (e) {}

  // ---------- dates ----------
  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
  const weekNo = (s) => { const d = diffDays(PLAN.start, s); return d < 0 ? 0 : Math.floor(d / 7) + 1; };
  const clampW = (w) => Math.min(Math.max(w, 1), 12);
  const weekObj = (w) => WEEKS[clampW(w) - 1];
  const fmt = (s, o) => s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", o || { weekday: "short", day: "numeric", month: "short" }) : "";
  const mode = (s) => { if (s > PLAN.internEnd) return "full"; const g = new Date(s + "T00:00:00").getDay(); return g === 6 ? "sat" : g === 0 ? "sun" : "intern"; };

  // ---------- derived ----------
  const ps = (n) => S.problems[String(n)] || {};
  function revDue(n, t) {
    const p = ps(n); if (!p.solvedOn) return null;
    if (!p.r3On) return addDays(p.solvedOn, 3) <= t ? "R3" : null;
    if (!p.r10On && addDays(p.solvedOn, 10) <= t) return "R10";
    return null;
  }
  function dueList(t) {
    return NUMS.filter((n) => revDue(n, t)).map((n) => {
      const k = revDue(n, t); return { n, kind: k, late: diffDays(addDays(ps(n).solvedOn, k === "R3" ? 3 : 10), t) };
    }).sort((a, b) => b.late - a.late);
  }
  function backlog(t) {
    const cw = Math.max(weekNo(t), 1); const behind = [], cur = [];
    WEEKS.forEach((w) => w.set.forEach((n) => {
      if (ps(n).solvedOn) return;
      if (w.w < cw) behind.push(n); else if (w.w === cw) cur.push(n);
    }));
    return { behind: behind.length, queue: behind.concat(cur) };
  }
  const isActive = (a) => !CLOSED.includes(a.status);
  const overdueApps = (t) => Object.entries(S.apps).filter(([, a]) => isActive(a) && a.nextDate && a.nextDate <= t).sort((x, y) => x[1].nextDate < y[1].nextDate ? -1 : 1);
  const mockAvg = (m) => { const v = (m.scores || []).map(Number).filter(Boolean); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
  const inW = (d, w) => d && d >= w.from && d <= w.to;

  function metrics(wn) {
    const w = weekObj(wn);
    const m = { newP: 0, extra: 0, revs: 0, apps: 0, refs: 0, dms: 0, contests: 0, mocks: 0, hours: 0, proj: 0, energy: [], days: 0, mvd: 0 };
    Object.values(S.problems).forEach((p) => { if (inW(p.solvedOn, w)) m.newP++; if (inW(p.r3On, w)) m.revs++; if (inW(p.r10On, w)) m.revs++; });
    Object.values(S.apps).forEach((a) => { if (inW(a.applied, w) && a.status !== "Wishlist") m.apps++; });
    Object.values(S.mocks).forEach((x) => { if (inW(x.date, w)) m.mocks++; });
    Object.entries(S.logs).forEach(([d, l]) => {
      if (!inW(d, w)) return;
      m.days++; m.extra += +l.extra || 0; m.refs += +l.refs || 0; m.dms += +l.dms || 0; m.hours += +l.hours || 0; m.proj += +l.proj || 0;
      if (l.contest) m.contests++; if (l.energy) m.energy.push(+l.energy); if (l.mvd) m.mvd++;
    });
    m.prob = m.newP + m.extra;
    const c = (S.weeks[String(clampW(wn))] || {}).checks || {};
    m.checked = w.done.filter((_, i) => c[i]).length; m.doneTotal = w.done.length;
    m.rows = [["Problems", m.prob, w.t.prob], ["Applications", m.apps, w.t.apps], ["Referral asks", m.refs, w.t.refs],
      ["Cold DMs", m.dms, w.t.dms], ["Contests", m.contests, w.t.contests], ["Mocks", m.mocks, w.t.mocks]];
    const sc = m.rows.filter((r) => r[2] > 0);
    m.score = sc.length ? Math.round(100 * sc.reduce((s, r) => s + Math.min(r[1] / r[2], 1), 0) / sc.length) : 0;
    m.avgEnergy = m.energy.length ? (m.energy.reduce((a, b) => a + b, 0) / m.energy.length).toFixed(1) : "–";
    return m;
  }

  function flags() {
    const t = today(); const out = []; if (t < PLAN.start) return out;
    const cw = weekNo(t);
    const y1 = addDays(t, -1), y2 = addDays(t, -2);
    if (y2 >= PLAN.start && !S.logs[y1] && !S.logs[y2]) out.push("missed2");
    if (cw > 1 && cw <= 13) {
      const pm = metrics(cw - 1);
      if (pm.prob < 5) out.push("lowProblems");
      if (pm.apps === 0) out.push("zeroApps");
      if (pm.score < 60) out.push("lowWeek");
    }
    if (cw >= 1 && cw <= 12) {
      const m = metrics(cw); const dIn = diffDays(weekObj(cw).from, t);
      if (dIn >= 4 && m.prob < 5 && !out.includes("lowProblems")) out.push("lowProblems");
      if (dIn >= 3 && m.apps === 0 && !out.includes("zeroApps")) out.push("zeroApps");
    }
    if (dueList(t).filter((x) => x.late > 0).length > 6) out.push("revisitPile");
    const recent = Object.keys(S.logs).sort().slice(-3);
    if (recent.length === 3 && recent.every((d) => S.logs[d].energy && +S.logs[d].energy <= 2)) out.push("lowEnergy");
    if (overdueApps(t).length) out.push("followups");
    if (cw >= 5 && cw <= 13 && metrics(cw - 1).contests === 0 && metrics(cw - 2).contests === 0) out.push("noContest");
    const last14 = Object.values(S.apps).filter((a) => a.applied && a.applied >= addDays(t, -14));
    if (last14.length >= 20 && !last14.some((a) => !["Wishlist", "Applied", "Ghosted"].includes(a.status))) out.push("noCallbacks");
    const ms = Object.values(S.mocks).sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-2);
    if (ms.length === 2 && ms.every((x) => mockAvg(x) < 3)) out.push("lowMocks");

  // ---------- persistence ----------
  const chains = {};
  const errMsg = (e) => (e && e.code === "quota_exceeded") ? "Storage is full; delete old entries." : (e && e.code) ? "Try again in a moment (" + e.code + ")." : "Try again in a moment.";
  function save(path, data) {
    const [c, id] = path.split("/");
    if (data === null) delete S[c][id]; else S[c][id] = data;
    schedule();
    if (!S.db) return Promise.resolve();
    const ref = S.db.doc(path);
    const run = () => (data === null ? ref.delete() : ref.set(data));
    const p = (chains[path] || Promise.resolve()).then(run).catch((e) => {
      if (e && e.code === "unavailable") return new Promise((r) => setTimeout(r, 700 + Math.random() * 900)).then(run).catch((e2) => toast("Couldn't save. " + errMsg(e2)));

  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Local mode: server.py serves this page and stores everything in data/db.json.
  let pendingSaves = 0;
  function localDb() {
    const api = (p, opt) => fetch("/api/db/" + p, opt).then((r) => {
      if (!r.ok) throw { code: "http_" + r.status };
      return r.status === 204 ? null : r.json();
    });
    const track = (p) => { pendingSaves++; return p.finally(() => { pendingSaves--; }); };
    return {
      doc(path) {
        return {
          set: (data) => track(api(path, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(data) })),
          delete: () => track(api(path, { method: "DELETE" })),
        };
      },
      collection(c) {
        return {
          onSnapshot(next, onErr) {
            const pull = () => api(c).then((m) => next({ docs: Object.entries(m || {}).map(([id, d]) => ({ id, exists: true, data: () => d })) })).catch(onErr);
            pull();
            const t = setInterval(() => { if (!document.hidden && pendingSaves === 0) pull(); }, 15000);
            return () => clearInterval(t);
          },
        };
      },
    };
  }

  async function connect() {
    let db = null;
    try {
      const r = await fetch("/api/ping", { cache: "no-store" });
      if (r.ok && (await r.json()).ok) db = localDb();
    } catch (e) { db = null; }
    if (!db) {
      try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    }
    if (!db) {
      const b = $("#banner"); b.hidden = false;
      b.textContent = "Not saving. Start the local app (run ./start.sh in the tracker folder) and open http://127.0.0.1:8765.";
      return;
    }
    S.db = db;
    ["logs", "problems", "apps", "weeks", "mocks", "meta"].forEach((c) => {
      db.collection(c).onSnapshot((snap) => {
        const m = {}; snap.docs.forEach((d) => { if (d.exists) m[d.id] = d.data(); }); S[c] = m; schedule();
      }, (err) => {
        const b = $("#banner"); b.hidden = false; b.textContent = "Sync stopped (" + err.code + "). Reload the page to reconnect.";
      });
    });
  }

  // ---------- activity heatmap ----------
  const HM = {
    all: { label: "All activity", unit: "points", steps: [1, 3, 6, 10], hint: "everything you marked: problems, revisits, lessons, Q&A, designs, checklists, applications, referral asks, DMs" },
    learn: { label: "Learning", unit: "marks", steps: [1, 3, 6, 10], hint: "lessons completed + Core CS/AI questions marked known + designs + done-means ticked" },
    dsa: { label: "DSA", unit: "problems", steps: [1, 2, 3, 5], hint: "new + revisited + extra problems" },
    apps: { label: "Job search", unit: "actions", steps: [1, 3, 6, 10], hint: "applications + referral asks + cold DMs" },
    hours: { label: "Study hours", unit: "hours", steps: [0.5, 2, 4, 6], hint: "hours logged in the nightly tracker" }
  };
  function dayStats(d) {
    const l = S.logs[d] || {};
    const newP = NUMS.filter((n) => ps(n).solvedOn === d).length;
    const rev = NUMS.filter((n) => ps(n).r3On === d || ps(n).r10On === d).length;
    const extra = +l.extra || 0;
    const apps = Object.values(S.apps).filter((a) => a.applied === d && a.status !== "Wishlist").length;
    const refs = +l.refs || 0, dms = +l.dms || 0, hours = +l.hours || 0;
    const onDay = (obj) => Object.values(obj || {}).filter((x) => x === d).length;
    const lessons = onDay(learnMeta().done);
    const qa = onDay((S.meta.cs || {}).known);
    const designs = onDay((S.meta.sd || {}).done);
    const checks = Object.values(S.weeks).reduce((n, w) => n + onDay(w.checks), 0);
    const learned = lessons + qa + designs + checks;
    const v = { all: newP + rev + extra + learned + apps + refs + dms, learn: learned, dsa: newP + rev + extra, apps: apps + refs + dms, hours };
    return { newP, rev, extra, apps, refs, dms, hours, lessons, qa, designs, checks, logged: !!S.logs[d], v };
  }
  const hmLevel = (x, steps) => (x <= 0 ? 0 : x < steps[1] ? 1 : x < steps[2] ? 2 : x < steps[3] ? 3 : 4);
  function heatmap() {
    const key = S.heatMetric, m = HM[key], t = today();
    const start = PLAN.start, end = PLAN.deadline, days = diffDays(start, end) + 1, cols = Math.ceil(days / 7);
    const months = {}; let active = 0, cur = 0, best = 0, run = 0, total = 0;
    for (let i = 0; i < days; i++) {
      const d = addDays(start, i); if (d > t) break;
      const x = dayStats(d).v[key]; total += x;
      if (x > 0) { active++; run++; best = Math.max(best, run); } else run = 0;
    }
    for (let i = diffDays(start, t); i >= 0; i--) { const d = addDays(start, i); if (dayStats(d).v[key] > 0) cur++; else if (d !== t) break; }
    let cells = "";
    for (let c = 0; c < cols; c++) {
      const d0 = addDays(start, c * 7), mo = fmt(d0, { month: "short" });
      if (!Object.values(months).includes(mo)) months[c] = mo;
    }
    let grid = `<span></span>` + Array.from({ length: cols }, (_, c) => `<span class="hm-m">${months[c] || ""}</span>`).join("");
    ["Mon", "", "Wed", "", "Fri", "", "Sun"].forEach((lab, r) => {
      grid += `<span class="hm-d">${lab}</span>`;
      for (let c = 0; c < cols; c++) {
        const i = c * 7 + r, d = addDays(start, i);
        if (i >= days) { grid += `<span></span>`; continue; }
        if (d > t) { grid += `<span class="hm-cell future" aria-hidden="true"></span>`; continue; }
        const s = dayStats(d), x = s.v[key], lv = hmLevel(x, m.steps);

      }
    });
    const elapsed = Math.max(Math.min(diffDays(start, t) + 1, days), 0);
    const sw = (lv) => `<i style="background:var(--heat-${lv})"></i>`;
    return `<section class="card">
      <div class="card-h"><h2>Activity heatmap</h2><div class="chips">${Object.entries(HM).map(([k, v]) => `<button class="btn sm" data-act="heatm" data-v="${k}" aria-pressed="${k === key}">${v.label}</button>`).join("")}</div></div>

    </section>`;

  const hmTip = () => document.getElementById("hmTip");
  function showTip(el) {
    const tip = hmTip(); if (!tip) return;
    const parts = el.dataset.tip.split("|");
    tip.innerHTML = `<b>${esc(parts[0])}</b><br>` + parts.slice(1).map(esc).join("<br>");
    tip.hidden = false;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, hgt = tip.offsetHeight;
    let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    let y = r.top - hgt - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }

        <section class="card"><div class="card-h"><h2>Red flags now</h2><span class="pill ${fl.length ? "bad" : "good"}">${fl.length || "None"}</span></div>
          ${fl.length ? fl.map((k) => `<div class="flag"><b>${esc(FLAGS[k].title)}</b><span class="small">${esc(FLAGS[k].fix)}</span></div>`).join("") : `<p class="ok">Clean week so far.</p>`}
        </section>
      </div>
      <section class="card"><div class="card-h"><h2>Daily logs · ${fmt(w.from)} – ${fmt(w.to)}</h2></div>
        ${logs.length ? `<div class="tbl"><table><thead><tr><th>Date</th><th class="num">New</th><th class="num">Extra</th><th class="num">Refs</th><th class="num">DMs</th><th class="num">Hours</th><th class="num">Energy</th><th>Blocker</th></tr></thead><tbody>${logs.map(([d, l]) => `<tr><td>${fmt(d)}${l.mvd ? ' <span class="pill warn">MVD</span>' : ""}</td><td class="num">${NUMS.filter((n) => ps(n).solvedOn === d).length}</td><td class="num">${+l.extra || 0}</td><td class="num">${+l.refs || 0}</td><td class="num">${+l.dms || 0}</td><td class="num">${+l.hours || 0}</td><td class="num">${l.energy || "–"}</td><td>${esc(l.blocker)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">No logs this week yet.</p>`}
      </section>`;
    },
    form() {
      const wn = S.reviewWeek || clampW(weekNo(today())), r = (S.weeks[String(wn)] || {}).review || {};
      return `<section class="card">
        <div class="card-h"><h2>Sunday review</h2><label class="inline small">Week <select id="reviewWeek" style="width:auto">${WEEKS.map((w) => `<option value="${w.w}"${w.w === wn ? " selected" : ""}>Week ${w.w} · ${fmt(w.from, { day: "numeric", month: "short" })}</option>`).join("")}</select></label></div>
        <div class="fgrid">
          <label class="f span">What worked<textarea id="r-worked">${esc(r.worked)}</textarea></label>
          <label class="f span">What failed<textarea id="r-failed">${esc(r.failed)}</textarea></label>
          <label class="f span">Fix for next week (specific, with numbers)<textarea id="r-fix">${esc(r.fix)}</textarea></label>
          <label class="f span">Target changes you want Claude to consider<textarea id="r-adjust">${esc(r.adjust)}</textarea></label>
        </div>
        <div class="actions"><button class="btn primary" data-act="reviewSave">Save review</button><button class="btn" data-act="reviewCopy">Copy weekly review for Claude</button></div>
      </section>`;
    }
  };

  VIEWS.cs = {
    live() {
      const k = S.csTopic, known = (S.meta.cs || {}).known || {}, sdDone = (S.meta.sd || {}).done || {};
      const tabs = Object.entries(CS).map(([id, t]) => {
        const n = t.qa.filter((_, i) => known[id + "-" + (i + 1)]).length;
        return `<button class="btn sm" data-act="cst" data-v="${id}" aria-pressed="${k === id}">${t.label} <span class="num">${n}/40</span></button>`;
      }).join("") + `<button class="btn sm" data-act="cst" data-v="sd" aria-pressed="${k === "sd"}">System design <span class="num">${SD.filter((x) => sdDone[x[0]]).length}/${SD.length}</span></button>`;
      let body;
      if (k === "sd") {
        body = `<p class="small muted">Answer template (45 min): requirements 5, estimates 3, API 5, data model 5, diagram 10, deep dive on 2 components 12, bottlenecks and trade-offs 5. Free resources: system-design-primer (GitHub), ByteByteGo, Hello Interview, awesome-low-level-design.</p>
          ${SD.map(([id, name, cover]) => `<label class="check"><input type="checkbox" data-chg="sd" data-id="${id}"${sdDone[id] ? " checked" : ""}><span><b>${esc(name)}</b><br><span class="muted small">${esc(cover)}</span></span></label>`).join("")}`;
      } else {
        body = `<p class="small muted">Read the question, answer it out loud in 30 seconds, then open it to check. Tick only what you can explain with a follow-up "why".</p>` +
          CS[k].qa.map(([q, a], i) => {
            const id = k + "-" + (i + 1), on = !!known[id];
            return `<details class="qa ${on ? "known" : ""}"><summary><span class="num muted small">${i + 1}</span><span class="q">${esc(q)}</span><button class="btn sm" data-act="know" data-id="${id}" aria-pressed="${on}">${on ? "Known" : "Mark known"}</button></summary><div class="a">${esc(a)}</div></details>`;
          }).join("");
      }
      return `<section class="card"><div class="card-h"><h2>Core CS and system design</h2></div><div class="chips">${tabs}</div></section><section class="card">${body}</section>`;
    }
  };

  VIEWS.playbook = {
    live() {
      const nav = PLAYBOOK.map((s) => `<button class="btn sm" data-act="jump" data-v="pb-${s.id}">${esc(s.title)}</button>`).join("") +
        `<button class="btn sm" data-act="jump" data-v="pb-flags">Red-flag rules</button><button class="btn sm" data-act="jump" data-v="pb-tpl">Templates</button><button class="btn sm" data-act="jump" data-v="pb-py">Python cheatsheet</button>`;
      const mocks = Object.entries(S.mocks).sort((a, b) => (a[1].date < b[1].date ? 1 : -1));
      return `<section class="card"><div class="card-h"><h2>Playbook</h2></div><div class="subnav">${nav}</div></section>
        ${PLAYBOOK.map((s) => `<section class="card" id="pb-${s.id}"><h2>${esc(s.title)}</h2><div class="prose">${s.html}</div>
          ${s.id === "mocks" ? `<div class="eyebrow" style="margin-top:14px">Mock history</div>${mocks.length ? `<div class="tbl"><table><thead><tr><th>Date</th><th>Type</th><th>Problem / topic</th>${MOCK_CRITERIA.map((c) => `<th class="num" title="${esc(c)}">${esc(c.split(" ")[0])}</th>`).join("")}<th class="num">Avg</th></tr></thead><tbody>${mocks.map(([, x]) => `<tr><td>${fmt(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.topic)}</td>${(x.scores || []).map((v) => `<td class="num">${esc(v)}</td>`).join("")}<td class="num"><span class="pill ${mockAvg(x) >= 3.5 ? "good" : mockAvg(x) >= 3 ? "warn" : "bad"}">${mockAvg(x).toFixed(1)}</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">No mocks yet. The first mock OA is due in Week 5.</p>`}` : ""}
        </section>`).join("")}
        <section class="card" id="pb-flags"><h2>Red-flag rules</h2><p class="small muted">These are checked automatically and shown on Today and Review.</p>
          ${Object.values(FLAGS).map((f) => `<div class="flag"><b>${esc(f.title)}</b><span class="small">${esc(f.fix)}</span></div>`).join("")}</section>
        <section class="card" id="pb-tpl"><h2>Templates</h2><p class="small muted">Fill every [bracket] before sending. Personalise the first line every time.</p>
          ${TEMPLATES.map(([t, body], i) => `<div style="margin-top:14px"><div class="card-h" style="margin-bottom:0"><h3>${esc(t)}</h3><button class="btn sm" data-act="copyTpl" data-i="${i}">Copy</button></div><pre>${esc(body)}</pre></div>`).join("")}</section>
        <section class="card" id="pb-py"><h2>Python for interviews</h2><pre class="code">${esc(CHEATSHEET)}</pre></section>`;
    },
    form() {
      return `<section class="card"><h2>Log a mock</h2>
        <div class="fgrid" style="margin-top:10px">
          <label class="f">Date<input id="m-date" type="date" value="${today()}"></label>
          <label class="f">Type<select id="m-type">${opt(["DSA", "Mock OA", "Project", "System design", "LLD / machine coding", "HR"], "DSA")}</select></label>
          <label class="f span">Problem / topic<input id="m-topic" placeholder="e.g. Rotting Oranges, URL shortener"></label>
          ${MOCK_CRITERIA.map((c, i) => `<label class="f">${esc(c)}<select id="m-s${i}">${opt(["1", "2", "3", "4", "5"], "3")}</select></label>`).join("")}
          <label class="f span">Notes (what to fix)<textarea id="m-notes"></textarea></label>
        </div>
        <div class="actions"><button class="btn primary" data-act="mockSave">Save mock</button></div></section>`;
    }
  };

  // ---------- render ----------
  function renderHeader() {
    const t = today(), w = weekNo(t), day = diffDays(PLAN.start, t) + 1, left = diffDays(t, PLAN.deadline);
    const solved = Object.values(S.problems).filter((p) => p.solvedOn).length, apps = Object.values(S.apps).filter((a) => a.status !== "Wishlist").length;
    $("#meta").innerHTML = `<span><b>${fmt(t, { weekday: "short", day: "numeric", month: "short" })}</b></span>
      <span>${w < 1 ? "Starts 5 Oct" : w > 12 ? "Plan complete" : "Week <b>" + w + "</b>/12 · Day <b class='num'>" + day + "</b>/84"}</span>
      <span><b class="num">${Math.max(left, 0)}</b> days to 31 Dec</span>
      <span><b class="num">${solved}</b>/150 solved</span><span><b class="num">${apps}</b> applied</span>`;
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  }
  function render(forceForm) {
    renderHeader();
    const v = VIEWS[S.tab] || VIEWS.today;
    $("#view").classList.toggle("form-first", S.tab === "apps");
    $("#live").innerHTML = v.live();
    const fe = $("#form"), focused = fe.contains(document.activeElement);
    if (forceForm || !(focused || S.pending)) fe.innerHTML = v.form ? v.form() : "";
  }
  let raf = 0;
  function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(false); }); }

  // ---------- reports ----------
  function report(d) {
    const l = S.logs[d] || {}, w = clampW(weekNo(d)), m = metrics(w), wk = weekObj(w);
    const solved = NUMS.filter((n) => ps(n).solvedOn === d), revd = NUMS.filter((n) => ps(n).r3On === d || ps(n).r10On === d);
    const apps = Object.values(S.apps).filter((a) => a.applied === d && a.status !== "Wishlist"), due = dueList(today()), fl = flags();
    return [
      `TRACKER: ${fmt(d, { weekday: "short", day: "numeric", month: "short", year: "numeric" })} (Week ${w}, Day ${diffDays(PLAN.start, d) + 1})`,
      `DSA new (${solved.length}): ${solved.map((n) => `#${n} ${P[n].name} (${P[n].diff})`).join(", ") || "none"}`,
      `Extra solved: ${+l.extra || 0}${l.extraNames ? " (" + l.extraNames + ")" : ""}`,
      `Revised (${revd.length}): ${revd.map((n) => P[n].name).join(", ") || "none"} · revisits still due: ${due.length}`,
      `Core CS: ${l.cs || "none"}`,
      `Project hrs: ${+l.proj || 0}`,
      `Applications (${apps.length}): ${apps.map((a) => a.company + (a.role ? " – " + a.role : "")).join(", ") || "none"}`,
      `Referral asks: ${+l.refs || 0} · Cold DMs: ${+l.dms || 0} · Contest/mock OA: ${l.contest ? "yes" : "no"}`,
      `Study hrs: ${+l.hours || 0} · Energy: ${l.energy || "?"}/5 · MVD: ${l.mvd ? "yes" : "no"}`,
      `Biggest blocker: ${l.blocker || "none"}`,
      `Tomorrow top 3: 1) ${(l.top3 || [])[0] || "-"} 2) ${(l.top3 || [])[1] || "-"} 3) ${(l.top3 || [])[2] || "-"}`,
      `Week ${w} so far: ${m.rows.map((r) => `${r[0].toLowerCase()} ${r[1]}/${r[2]}`).join(" · ")} · score ${m.score}%`,
      `Red flags: ${fl.map((k) => FLAGS[k].title).join("; ") || "none"}`,
      l.notes ? `Notes: ${l.notes}` : ""
    ].filter(Boolean).join("\n");
  }
  function weeklyReport(wn) {
    const w = weekObj(wn), m = metrics(wn), r = (S.weeks[String(wn)] || {}).review || {}, c = (S.weeks[String(wn)] || {}).checks || {};
    return [
      `WEEKLY REVIEW: Week ${wn} (${fmt(w.from)} – ${fmt(w.to)}) · ${w.title}`,
      `Scorecard: ${m.rows.map((x) => `${x[0]} ${x[1]}/${x[2]}`).join(" · ")} · score ${m.score}%`,
      `Problems: ${m.newP} from list + ${m.extra} extra · revisits ${m.revs} · days logged ${m.days}/7 · MVDs ${m.mvd} · study ${m.hours} h · project ${m.proj} h · energy avg ${m.avgEnergy}`,
      `Done means: ${w.done.map((d, i) => (c[i] ? "[x] " : "[ ] ") + d).join(" | ")}`,
      `Solved overall: ${Object.values(S.problems).filter((p) => p.solvedOn).length}/150 · behind plan: ${backlog(today()).behind}`,
      `Pipeline: ${STATUSES.map((s) => [s, Object.values(S.apps).filter((a) => a.status === s).length]).filter((x) => x[1]).map((x) => x[0] + " " + x[1]).join(", ") || "empty"}`,
      `What worked: ${r.worked || "-"}`, `What failed: ${r.failed || "-"}`, `Fix for next week: ${r.fix || "-"}`, `Target changes requested: ${r.adjust || "-"}`
    ].join("\n");
  }

  // ---------- events ----------
  const val = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };
  document.addEventListener("input", (e) => { if (e.target.closest("#form")) S.pending = true; });

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, n = b.dataset.n, t = today();
    if (act === "know") e.preventDefault();
    switch (act) {
      case "openLesson": {
        const id = b.dataset.id; S.tab = "learn"; S.lesson = id; S.pending = false;
        try { localStorage.setItem("lpa.tab", "learn"); } catch (x) {}
        if (learnMeta().last !== id) save("meta/learn", { ...learnMeta(), last: id });
        render(true); window.scrollTo(0, 0); break;
      }
      case "closeLesson": S.lesson = null; render(true); window.scrollTo(0, 0); break;
      case "lessonDone": {
        const d = { ...(learnMeta().done || {}) }; const id = b.dataset.id;
        if (d[id]) delete d[id]; else d[id] = t;
        save("meta/learn", { ...learnMeta(), done: d });
        if (d[id]) toast("Lesson complete. Next: solve its practice problems."); break;
      }
      case "quiz": { const id = b.dataset.id; S.quiz[id] = { ...(S.quiz[id] || {}), [b.dataset.q]: +b.dataset.o }; render(); break; }
      case "heatm": S.heatMetric = b.dataset.v; render(); break;
      case "copyCode": copy(codeReg[+b.dataset.i] || "", "Code copied. Paste it into your editor."); break;
      case "tab": if (b.dataset.v === "learn") S.lesson = null; S.tab = b.dataset.v; S.pending = false; S.confirmDel = null; try { localStorage.setItem("lpa.tab", S.tab); } catch (x) {} render(true); window.scrollTo(0, 0); break;
      case "solve": save("problems/" + n, { ...ps(n), solvedOn: t, stuck: false }); toast("Solved. R3 revisit due " + fmt(addDays(t, 3)) + "."); break;
      case "stuck": save("problems/" + n, { ...ps(n), stuck: !ps(n).stuck }); break;
      case "rev": save("problems/" + n, { ...ps(n), [b.dataset.k === "R3" ? "r3On" : "r10On"]: t }); toast(b.dataset.k + " revisit logged."); break;
      case "unsolve": save("problems/" + n, null); break;
      case "pf": S.probFilter = b.dataset.v; render(); break;
      case "af": S.appFilter = b.dataset.v; S.confirmDel = null; render(); break;
      case "cst": S.csTopic = b.dataset.v; render(); break;
      case "know": { const k = { ...((S.meta.cs || {}).known || {}) }; if (k[b.dataset.id]) delete k[b.dataset.id]; else k[b.dataset.id] = t; save("meta/cs", { known: k }); break; }
      case "jump": { const el = document.getElementById(b.dataset.v); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); break; }
      case "copyTpl": copy(TEMPLATES[+b.dataset.i][1], "Template copied. Fill the [brackets] before sending."); break;
      case "closeCopy": $("#copyPanel").hidden = true; break;
      case "logSave": {
        const d = S.logDate || t; const en = document.querySelector('input[name="l-energy"]:checked');
        const data = { date: d, extra: +val("l-extra") || 0, extraNames: val("l-extraNames"), cs: val("l-cs"), proj: +val("l-proj") || 0,
          refs: +val("l-refs") || 0, dms: +val("l-dms") || 0, hours: +val("l-hours") || 0, energy: en ? +en.value : null,
          contest: $("#l-contest").checked, mvd: $("#l-mvd").checked, blocker: val("l-blocker"),
          top3: [val("l-t1"), val("l-t2"), val("l-t3")], notes: val("l-notes"), savedAt: new Date().toISOString() };
        S.pending = false; document.activeElement && document.activeElement.blur(); save("logs/" + d, data); toast("Tracker saved. Copy it to Claude or say \"check my tracker\"."); render(true); break;
      }
      case "logCopy": copy(report(S.logDate || t)); break;
      case "appSave": {
        const company = val("a-company"); if (!company) { toast("Add the company name first."); document.getElementById("a-company").focus(); return; }
        const id = S.editApp || newId();
        const data = { company, role: val("a-role"), tier: val("a-tier"), source: val("a-source"), status: val("a-status"), applied: val("a-applied"),
          link: val("a-link"), referral: val("a-referral"), contact: val("a-contact"), next: val("a-next"), nextDate: val("a-nextDate"), ctc: val("a-ctc"), notes: val("a-notes"),
          lastAction: t, created: (S.apps[id] && S.apps[id].created) || t };
        S.editApp = null; S.pending = false; document.activeElement && document.activeElement.blur(); save("apps/" + id, data); toast(company + " saved."); render(true); break;
      }
      case "appEdit": S.editApp = b.dataset.id; S.pending = false; render(true); window.scrollTo({ top: 0, behavior: "smooth" }); break;
      case "appCancel": S.editApp = null; S.pending = false; render(true); break;
      case "appDel": if (S.confirmDel === b.dataset.id) { save("apps/" + b.dataset.id, null); S.confirmDel = null; toast("Deleted."); } else { S.confirmDel = b.dataset.id; render(); } break;
      case "reviewSave": {
        const wn = S.reviewWeek || clampW(weekNo(t)); const cur = S.weeks[String(wn)] || {};
        S.pending = false; document.activeElement && document.activeElement.blur();
        save("weeks/" + wn, { ...cur, review: { worked: val("r-worked"), failed: val("r-failed"), fix: val("r-fix"), adjust: val("r-adjust"), savedAt: new Date().toISOString() } });
        toast("Review saved."); render(true); break;
      }
      case "reviewCopy": copy(weeklyReport(S.reviewWeek || clampW(weekNo(t)))); break;
      case "mockSave": {
        const id = newId();
        save("mocks/" + id, { date: val("m-date") || t, type: val("m-type"), topic: val("m-topic"), scores: MOCK_CRITERIA.map((_, i) => +val("m-s" + i)), notes: val("m-notes") });
        S.pending = false; toast("Mock saved."); render(true); break;
      }
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "logDate") { S.logDate = el.value || null; S.pending = false; el.blur(); render(true); return; }
    if (el.id === "reviewWeek") { S.reviewWeek = +el.value; S.pending = false; el.blur(); render(true); return; }
    const k = el.dataset.chg; if (!k) return;
    if (k === "wcheck") {
      const cur = S.weeks[el.dataset.w] || {}; const checks = { ...(cur.checks || {}) }; if (el.checked) checks[el.dataset.i] = today(); else delete checks[el.dataset.i];
      save("weeks/" + el.dataset.w, { ...cur, checks });
    } else if (k === "appstatus") {
      const a = S.apps[el.dataset.id]; if (a) save("apps/" + el.dataset.id, { ...a, status: el.value, lastAction: today() });
    } else if (k === "sd") {
      const d = { ...((S.meta.sd || {}).done || {}) }; if (el.checked) d[el.dataset.id] = today(); else delete d[el.dataset.id]; save("meta/sd", { done: d });
    }
  });

  // Refresh the date-driven views when the day rolls over.
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); S.logDate = null; render(); } }, 60000);

  render(true);
  connect();
})();
</script>
